<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#114d35">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Input Ketidakhadiran - MySantriQu</title>
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
  <link rel="stylesheet" href="input.css">
</head>
<body data-access="supervisor">
  <nav class="navbar">
    <div class="nav-brand">
      <img src="assets/Logo.png" alt="Logo MySantriQu" class="nav-logo">
      <span>Recording Mahasantri</span>
    </div>
    <a class="btn-back" href="dashboard.html">
      <ion-icon name="arrow-back-outline" aria-hidden="true"></ion-icon> Kembali
    </a>
  </nav>

  <main class="container">
    <h1>
      <span class="page-heading-icon"><ion-icon name="clipboard-outline" aria-hidden="true"></ion-icon></span>
      Input Ketidakhadiran
    </h1>

    <div class="card">
      <h2><ion-icon name="calendar-outline" aria-hidden="true"></ion-icon> Pilih Kegiatan dan Tanggal</h2>
      <div class="form-grid">
        <div>
          <label for="kegiatan">Pilih Kegiatan</label>
          <select id="kegiatan" required>
            <option value="">Memuat kegiatan...</option>
          </select>
        </div>
        <div>
          <label for="tanggal">Tanggal</label>
          <input type="date" id="tanggal" required>
        </div>
      </div>

      <div class="session-card" aria-live="polite">
        <p id="session-message">Pilih kegiatan dan tanggal untuk melihat status sesi.</p>
        <button class="btn btn-green" id="prepare-session" type="button" hidden>
          <ion-icon name="checkmark-circle-outline" aria-hidden="true"></ion-icon>
          Siapkan Sesi Absensi
        </button>
      </div>
      <p id="status-message" class="status-message" role="status" aria-live="polite"></p>

      <section id="attendance-form" hidden>
        <h3><ion-icon name="person-add-outline" aria-hidden="true"></ion-icon> Tambah Santri yang Tidak Hadir</h3>
        <label for="cari">Cari Santri</label>
        <input id="cari" placeholder="Ketik nama atau No. KTM santri..." autocomplete="off" disabled>
        <div id="hasil" role="listbox" aria-label="Hasil pencarian santri"></div>

        <label for="alasan" style="margin-top: 12px;">Status Ketidakhadiran</label>
        <div style="display: flex; gap: 10px; margin-top: 6px;">
          <select id="alasan" style="flex: 1;">
            <option value="">-- Pilih Status --</option>
            <option value="sakit">Sakit</option>
            <option value="izin">Izin</option>
            <option value="alpha">Tanpa Keterangan (Alpha)</option>
            <option value="izin_menginap">Izin Menginap</option>
          </select>
          <button class="btn btn-green" id="add-santri" type="button" style="white-space: nowrap;">
            <ion-icon name="add-outline" aria-hidden="true"></ion-icon> Tambah
          </button>
        </div>

        <h3><ion-icon name="list-outline" aria-hidden="true"></ion-icon> Daftar Santri (<span id="jml">0</span>)</h3>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th style="width: 50px;">No</th>
                <th>Nama Santri</th>
                <th>Status</th>
                <th style="width: 150px;">Aksi</th>
              </tr>
            </thead>
            <tbody id="daftar">
              <tr><td colspan="4" class="empty-state">Belum ada data ketidakhadiran</td></tr>
            </tbody>
          </table>
        </div>

        <div class="action-grid">
          <button class="btn btn-outline" id="clear-batch" type="button">
            <ion-icon name="close-outline" aria-hidden="true"></ion-icon> Kosongkan daftar
          </button>
          <button class="btn btn-green" id="save-batch" type="button">
            <ion-icon name="save-outline" aria-hidden="true"></ion-icon> Simpan Semua
          </button>
        </div>
      </section>
    </div>
  </main>

  <script src="js/auth.js?v=20261023-4"></script>
  <script src="js/role-guard.js?v=20261023-4"></script>
  <script src="js/theme.js?v=20261023-13"></script>
  <script src="js/input.js"></script>
</body>
</html>
