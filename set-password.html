<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#114d35" />
    <title>Buat Kata Sandi - MySantriQu</title>
    <link rel="stylesheet" href="style.css?v=20261023-4" />
  </head>
  <body>
    <main class="login-box">
      <div class="brand-logo"><img src="assets/Logo.png" alt="Logo MySantriQu" /></div>
      <div class="brand-badge">Sistem Pendidikan</div>
      <form class="login-form" id="set-password-form">
        <h2 class="brand-title">Ahlan para Musyrif Sejati</h2>
        <h2>Buat kata sandi aplikasi</h2>
        <p class="register-text">Akun Google Anda sudah terverifikasi. Kata sandi ini digunakan untuk login ke MySantriQu.</p>
        <div class="input-box">
          <span class="icon" aria-hidden="true"></span>
          <input type="email" id="google-email" autocomplete="email" readonly />
          <label for="google-email">Email Google</label>
        </div>
        <div class="input-box">
          <span class="icon" aria-hidden="true"></span>
          <input type="password" id="new-password" autocomplete="new-password" minlength="10" maxlength="72" required />
          <label for="new-password">Kata sandi baru (minimal 10 karakter)</label>
        </div>
        <div class="input-box">
          <span class="icon" aria-hidden="true"></span>
          <input type="password" id="confirm-password" autocomplete="new-password" minlength="10" maxlength="72" required />
          <label for="confirm-password">Ulangi kata sandi</label>
        </div>
        <p id="password-message" class="auth-message" role="status" aria-live="polite" hidden></p>
        <button type="submit">Simpan dan lanjutkan ke Login</button>
      </form>
    </main>
    <script>
      const passwordForm = document.getElementById("set-password-form");
      const passwordMessage = document.getElementById("password-message");
      const submitButton = passwordForm.querySelector("button[type=submit]");
      submitButton.disabled = true;

      function showPasswordMessage(text, state) {
        passwordMessage.textContent = text;
        passwordMessage.dataset.state = state;
        passwordMessage.hidden = !text;
      }

      fetch("api/set-initial-password.php", { credentials: "same-origin" })
        .then(async (response) => {
          const data = await response.json();
          if (!response.ok || !data.success) throw new Error(data.error || "Verifikasi Google tidak ditemukan.");
          document.getElementById("google-email").value = data.account.email;
          submitButton.disabled = false;
        })
        .catch((error) => {
          showPasswordMessage(error.message, "error");
          submitButton.disabled = true;
        });

      passwordForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!passwordForm.reportValidity()) return;
        const password = document.getElementById("new-password").value;
        if (password !== document.getElementById("confirm-password").value) {
          showPasswordMessage("Kata sandi dan konfirmasinya tidak sama.", "error");
          return;
        }

        submitButton.disabled = true;
        try {
          const response = await fetch("api/set-initial-password.php", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "same-origin",
            body: JSON.stringify({ password }),
          });
          const data = await response.json();
          if (!response.ok || !data.success) throw new Error(data.error || "Kata sandi gagal disimpan.");
          let destination = "index.html?registered=1";
          try {
            sessionStorage.setItem("mysantriqu_registered_email", data.email);
          } catch (storageError) {
            destination += "&email=" + encodeURIComponent(data.email);
          }
          window.location.href = destination;
        } catch (error) {
          showPasswordMessage(error.message, "error");
          submitButton.disabled = false;
        }
      });
    </script>
  </body>
</html>
