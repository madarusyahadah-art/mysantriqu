<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#114d35">
  <title>Menunggu Penetapan Role - MySantriQu</title>
  <link rel="stylesheet" href="pilih-role.css"/>
    >
  
</head>
<body>
  <main class="role-card">
    <h1>Akun menunggu penetapan role</h1>
    <p>Role akun ditentukan oleh admin. Hubungi admin agar akun Anda dapat diaktifkan. Anda tidak dapat memilih atau mengubah role sendiri.</p>
    <p id="role-email"></p>
    <p id="role-error" role="alert"></p>
    <button class="btn btn-secondary" type="button" id="logout">Keluar</button>
  </main>
  <script>
    const errorBox = document.getElementById("role-error");
    fetch("api/session.php", { credentials: "same-origin" })
      .then(async (response) => {
        const data = await response.json();
        if (!response.ok || !data.success) throw new Error(data.error || "Sesi login tidak ditemukan.");
        if (data.user.role_selected) {
          window.location.replace("dashboard.html");
          return;
        }
        document.getElementById("role-email").textContent = data.user.email || "";
      })
      .catch((error) => { errorBox.textContent = error.message; });

    document.getElementById("logout").addEventListener("click", async () => {
      try {
        const response = await fetch("api/logout.php", { method: "POST", credentials: "same-origin" });
        const data = await response.json();
        if (!response.ok || !data.success) throw new Error(data.error || "Logout gagal.");
        window.location.href = "index.html";
      } catch (error) {
        errorBox.textContent = error.message;
      }
    });
  </script>
  <script src="js/theme.js?v=20261023-12"></script>
</body>
</html>
