<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#114d35">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/app-icon-192.png">
  <title>Pilih Peran - Recording Mahasantri</title>
  <link rel="stylesheet" href="app-theme.css?v=20261022-1">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .role-card { width: min(100%, 760px); padding: clamp(24px, 5vw, 40px); color: #f1fff5; background: rgba(5, 25, 16, 0.91); border: 1px solid rgba(154, 230, 180, 0.28); border-radius: 20px; box-shadow: 0 24px 65px rgba(0, 0, 0, 0.4); backdrop-filter: blur(18px); }
    .role-card h1 { color: #f1fff5; }
    .role-card > p { color: #c6e6d0; line-height: 1.65; }
    .role-options { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; margin: 24px 0; }
    .role-option { display: block; min-height: 126px; color: #e8fff0; background: rgba(255, 255, 255, 0.07); border: 1px solid rgba(186, 230, 200, 0.28); border-radius: 12px; padding: 18px; cursor: pointer; transition: background 0.2s ease, border-color 0.2s ease; }
    .role-option:has(input:checked) { border-color: #86efac; background: rgba(45, 211, 111, 0.18); box-shadow: inset 0 0 0 1px rgba(134, 239, 172, 0.22); }
    .role-option.is-admin-assigned { cursor: not-allowed; background: rgba(255, 255, 255, 0.035); }
    .role-option input { margin-right: 8px; }
    .role-option strong { color: #a7f3c0; }
    .role-option p { margin: 10px 0 0; color: #c6e6d0; line-height: 1.5; }
    .role-card #role-error { color: #fecaca; margin: 12px 0; }
    html[data-theme="light"] .role-card { color: #153728; background: rgba(250, 255, 251, 0.94); border-color: rgba(17, 77, 53, 0.2); }
    html[data-theme="light"] .role-card h1 { color: #123526; }
    html[data-theme="light"] .role-card > p { color: #456657; }
    html[data-theme="light"] .role-option { color: #153728; background: rgba(17, 77, 53, 0.035); border-color: rgba(17, 77, 53, 0.2); }
    html[data-theme="light"] .role-option:has(input:checked) { border-color: #1d7f52; background: rgba(45, 211, 111, 0.12); }
    html[data-theme="light"] .role-option.is-admin-assigned { background: rgba(17, 77, 53, 0.025); }
    html[data-theme="light"] .role-option strong { color: #176a43; }
    html[data-theme="light"] .role-option p { color: #456657; }
    html[data-theme="light"] .role-card #role-error { color: #b42318; }
    @media (prefers-reduced-motion: reduce) {
      .role-option { transition: none; }
    }
  </style>
</head>
<body>
  <main class="role-card">
    <h1>Pilih peran akun</h1>
    <p>Pendaftar baru otomatis memilih Mahasantri. Role Musyrif, Mas'ul, Kajur, dan Admin ditetapkan oleh admin.</p>
    <form id="role-form">
      <div class="role-options">
        <label class="role-option">
          <input type="radio" name="role" value="mahasantri" required>
          <strong>Mahasantri</strong>
          <p>Melihat laporan dan profil pribadi setelah akun dihubungkan oleh admin.</p>
        </label>
        <label class="role-option is-admin-assigned">
          <input type="radio" name="role" value="musyrif" disabled>
          <strong>Musyrif</strong>
          <p>Role operasional, ditetapkan oleh admin.</p>
        </label>
        <label class="role-option is-admin-assigned">
          <input type="radio" name="role" value="mas'ul" disabled>
          <strong>Mas'ul</strong>
          <p>Role operasional, ditetapkan oleh admin.</p>
        </label>
        <label class="role-option is-admin-assigned">
          <input type="radio" name="role" value="kajur" disabled>
          <strong>Kajur</strong>
          <p>Akses laporan, ditetapkan oleh admin.</p>
        </label>
        <label class="role-option is-admin-assigned">
          <input type="radio" name="role" value="admin" disabled>
          <strong>Admin</strong>
          <p>Akses administrasi, hanya ditetapkan oleh admin yang sudah terdaftar.</p>
        </label>
      </div>
      <p id="role-error" role="alert"></p>
      <button class="btn btn-primary" type="submit">Lanjutkan</button>
      <button class="btn btn-secondary" type="button" id="logout">Batal</button>
    </form>
  </main>
  <script>
    const form = document.getElementById("role-form");
    const errorBox = document.getElementById("role-error");
    fetch("api/session.php")
      .then((response) => {
        if (!response.ok) throw new Error("Sesi login tidak ditemukan. Silakan login kembali.");
        return response.json();
      })
      .then((data) => {
        if (data.user.role_selected) window.location.href = "dashboard.html";
      })
      .catch((error) => { errorBox.textContent = error.message; });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const role = new FormData(form).get("role");
      try {
        const response = await fetch("api/complete-role.php", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ role })
        });
        const data = await response.json();
        if (!response.ok || !data.success) throw new Error(data.error || "Role gagal disimpan.");
        window.location.href = "dashboard.html";
      } catch (error) {
        errorBox.textContent = error.message;
      }
    });

    document.getElementById("logout").addEventListener("click", async () => {
      await fetch("api/logout.php", { method: "POST" });
      window.location.href = "index.html";
    });
  </script>
    <script src="js/theme.js?v=20261012-3"></script>
</body>
</html>
