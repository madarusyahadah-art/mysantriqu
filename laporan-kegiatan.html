<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#114d35">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/app-icon-192.png">
  <title>Laporan Kegiatan Gabungan - MySantriQu</title>
  <link rel="stylesheet" href="app-theme.css?v=20261015">
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
  <style>
    .report-filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(175px, 1fr)); gap: 1rem; align-items: end; }
    .report-filters label { display: grid; gap: 0.4rem; }
    .table-wrap { overflow-x: auto; }
    .report-table { min-width: 850px; }
    .error-message {
      padding: 0.75rem 1rem;
      border: 1px solid rgba(248,113,113,0.34);
      border-radius: 12px;
      color: #fecaca;
      background: rgba(127,29,29,0.22);
    }
    .error-message:empty { display: none; }
    html[data-theme="light"] .error-message {
      border-color: rgba(190,24,93,0.22);
      color: #9f1239;
      background: rgba(255,241,242,0.95);
    }
  </style>
</head>
<body data-access="supervisor">
  <nav class="navbar">
    <div class="nav-brand">
      <img src="assets/Logo.png" alt="Logo" class="nav-logo">
      <ion-icon name="school-outline" aria-hidden="true"></ion-icon>
      <span>Recording Mahasantri</span>
    </div>
    <div class="nav-user">
      <img id="user-photo" src="assets/Logo.png" alt="" class="user-photo">
      <span id="user-name">Loading...</span>
      <button id="btn-logout" class="btn-logout" type="button">Logout</button>
    </div>
  </nav>
  <main class="container">
    <a class="btn-back" href="dashboard.html"><ion-icon name="arrow-back-outline" aria-hidden="true"></ion-icon> Kembali ke Dashboard</a>
    <h1><span class="page-heading-icon"><ion-icon name="documents-outline" aria-hidden="true"></ion-icon></span> Laporan Kegiatan Gabungan</h1>
    <section class="card report-filters">
      <label>Dari tanggal <input type="date" id="start"></label>
      <label>Sampai tanggal <input type="date" id="end"></label>
      <label>Kegiatan <select id="activity"><option value="">Semua kegiatan</option></select></label>
      <button class="btn btn-primary" id="search" type="button"><ion-icon name="search-outline" aria-hidden="true"></ion-icon> Tampilkan</button>
      <button class="btn btn-secondary" id="export" type="button"><ion-icon name="download-outline" aria-hidden="true"></ion-icon> Unduh CSV</button>
    </section>
    <p class="error-message" id="error" role="alert"></p>
    <section class="card table-wrap">
      <table class="report-table">
        <thead><tr><th>Tanggal</th><th>Kegiatan</th><th>Status Laporan</th><th>Pelapor</th><th>Jenis Peserta</th><th>Nama</th><th>Status Absensi</th><th>Keterangan</th><th>Tindak Lanjut</th></tr></thead>
        <tbody id="rows"><tr><td colspan="9">Memuat laporan...</td></tr></tbody>
      </table>
    </section>
  </main>
  <script>
    const start = document.getElementById("start");
    const end = document.getElementById("end");
    const activity = document.getElementById("activity");
    const today = new Date().toLocaleDateString("en-CA");
    start.value = new Date(Date.now() - 30 * 86400000).toLocaleDateString("en-CA");
    end.value = today;

    async function loadReport() {
      const query = new URLSearchParams({ tanggal_mulai: start.value, tanggal_selesai: end.value });
      if (activity.value) query.set("kegiatan_id", activity.value);
      const response = await fetch("api/get-laporan-kegiatan.php?" + query);
      const data = await response.json();
      if (!response.ok || !data.success) throw new Error(data.error || "Laporan gagal dimuat.");
      if (activity.options.length === 1) {
        data.kegiatan_list.forEach((item) => {
          const option = document.createElement("option");
          option.value = item.id;
          option.textContent = item.nama_kegiatan;
          activity.appendChild(option);
        });
      }
      const body = document.getElementById("rows");
      body.textContent = "";
      if (!data.laporan.length) {
        const tr = document.createElement("tr");
        const td = document.createElement("td");
        td.colSpan = 9;
        td.textContent = "Tidak ada laporan pada filter ini.";
        tr.appendChild(td);
        body.appendChild(tr);
        return;
      }
      data.laporan.forEach((row) => {
        const tr = document.createElement("tr");
        ["tanggal", "nama_kegiatan", "status_laporan", "nama_pelapor", "jenis_peserta", "nama_peserta", "status", "keterangan", "tindak_lanjut"]
          .forEach((key) => {
            const td = document.createElement("td");
            td.textContent = row[key] || "-";
            tr.appendChild(td);
          });
        body.appendChild(tr);
      });
    }

    function error(error) { document.getElementById("error").textContent = error.message; }
    document.getElementById("search").addEventListener("click", () => loadReport().catch(error));
    document.getElementById("export").addEventListener("click", () => {
      const query = new URLSearchParams({ tanggal_mulai: start.value, tanggal_selesai: end.value });
      if (activity.value) query.set("kegiatan_id", activity.value);
      window.location.href = "api/export-laporan-kegiatan.php?" + query;
    });
    loadReport().catch(error);
  </script>
  <script src="js/role-guard.js?v=20261014"></script>
  <script src="js/auth.js"></script>
  <script src="js/theme.js?v=20261015"></script>
  <script>
    const reportUser = JSON.parse(localStorage.getItem("user_data") || "{}");
    document.getElementById("user-name").textContent = reportUser.name || "Pengguna";
    document.getElementById("user-photo").src = reportUser.picture || reportUser.photo || "assets/Logo.png";
    document.getElementById("btn-logout").addEventListener("click", function() {
      localStorage.removeItem("user_data");
      localStorage.removeItem("user_id");
      localStorage.removeItem("user_role");
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
