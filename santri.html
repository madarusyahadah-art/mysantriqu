<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#114d35">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="assets/app-icon-192.png">
    <title>Manajemen Santri - Recording Mahasantri</title>
    
    <link rel="stylesheet" href="santri.css"/>
    >
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>
<body data-access="admin">
    <nav class="navbar">
        <div class="nav-brand">
            <img src="assets/Logo.png" alt="Logo" class="nav-logo">
            <ion-icon name="school-outline" aria-hidden="true"></ion-icon>
            <span>Recording Mahasantri</span>
        </div>
        <div class="nav-user">
            <img id="user-photo" src="" alt="User" class="user-photo">
            <span id="user-name">Loading...</span>
            <button id="btn-logout" class="btn-logout"><ion-icon name="log-out-outline" aria-hidden="true"></ion-icon> Logout</button>
        </div>
    </nav>

    <div class="container">
        <a href="dashboard.html" class="btn-back"><ion-icon name="arrow-back-outline" aria-hidden="true"></ion-icon> Kembali ke Dashboard</a>
        <h1><span class="page-heading-icon"><ion-icon name="people-outline" aria-hidden="true"></ion-icon></span> Manajemen Santri</h1>
        
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2>Daftar Santri</h2>
                <button class="btn btn-primary" onclick="openModal()">+ Tambah Santri</button>
            </div>
            
            <table>
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Nama</th>
                        <th>NIM</th>
                        <th>Asal</th>
                        <th>Angkatan</th>
                        <th>Semester aktif</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="santri-table-body">
                    <tr><td colspan="7">Memuat data...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal Tambah/Edit Santri -->
    <div class="modal" id="santriModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Tambah Santri</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <form id="santriForm">
                <input type="hidden" id="santriId">
                <div class="form-group">
                    <label>Nama Santri *</label>
                    <input type="text" id="santriNama" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>No. KTM</label>
                        <input type="text" id="santriKtm" maxlength="50">
                    </div>
                    <div class="form-group">
                        <label>Asal</label>
                        <input type="text" id="santriAsal">
                    </div>
                    <div class="form-group">
                        <label for="santriSemester">Semester aktif</label>
                        <select id="santriSemester" required>
                            <option value="1">Semester 1</option><option value="2">Semester 2</option>
                            <option value="3">Semester 3</option><option value="4">Semester 4</option>
                            <option value="5">Semester 5</option><option value="6">Semester 6</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Angkatan</label>
                        <input type="text" id="santriAngkatan" placeholder="Contoh: 2024">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Simpan</button>
            </form>
        </div>
    </div>

    <script>
        const user_id = localStorage.getItem("user_id");
        const user_role = localStorage.getItem("user_role");
        
        if (!user_id) {
            window.location.href = "index.html";
        }
        
        var cachedSantri = [];
        function escapeHtml(value) {
            return String(value || '').replace(/[&<>"']/g, function(character) {
                return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[character];
            });
        }

        // Load santri
        function loadSantri() {
            fetch('api/get-santri.php')
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    if (data.success) {
                        cachedSantri = data.santri;
                        var tbody = document.getElementById("santri-table-body");
                        if (data.santri.length === 0) {
                            tbody.innerHTML = '<tr><td colspan="7">Belum ada data santri</td></tr>';
                        } else {
                            var html = '';
                            data.santri.forEach(function(s, index) {
                                var nomor = index + 1;
                                html += '<tr>';
                                html += '<td>' + nomor + '</td>';
                                html += '<td><a href="profil-santri.html?id=' + Number(s.id) + '" style="color: #2d5016; text-decoration: none; font-weight: bold;">' + escapeHtml(s.nama) + '</a></td>';
                                html += '<td>' + escapeHtml(s.no_ktm || '-') + '</td>';
                                html += '<td>' + escapeHtml(s.asal || '-') + '</td>';
                                html += '<td>' + escapeHtml(s.angkatan || '-') + '</td>';
                                html += '<td>Semester ' + Number(s.semester_aktif || 1) + '</td>';
                                html += '<td>';
                                html += '<button class="btn btn-warning btn-sm" onclick="editSantri(' + Number(s.id) + ')">Edit</button> ';
                                html += '<button class="btn btn-danger btn-sm" onclick="deleteSantri(' + Number(s.id) + ')">Hapus</button>';
                                html += '</td>';
                                html += '</tr>';
                            });
                            tbody.innerHTML = html;
                        }
                    }
                })
                .catch(function(error) {
                    console.error('Error:', error);
                });
        }
        loadSantri();
        // Modal functions
        function openModal() {
            document.getElementById("modalTitle").textContent = "Tambah Santri";
            document.getElementById("santriForm").reset();
            document.getElementById("santriId").value = "";
            document.getElementById("santriKtm").value = "";
            document.getElementById("santriModal").classList.add("active");
        }
        
        function closeModal() {
            document.getElementById("santriModal").classList.remove("active");
        }
        
        function editSantri(id) {
            var santri = cachedSantri.find(function(item) { return Number(item.id) === Number(id); });
            if (!santri) return;
            document.getElementById("modalTitle").textContent = "Edit Santri";
            document.getElementById("santriId").value = id;
            document.getElementById("santriNama").value = santri.nama;
            document.getElementById("santriKtm").value = santri.no_ktm || "";
            document.getElementById("santriAsal").value = santri.asal || "";
            document.getElementById("santriAngkatan").value = santri.angkatan || "";
            document.getElementById("santriSemester").value = santri.semester_aktif || 1;
            document.getElementById("santriModal").classList.add("active");
        }
        
        // Form submit
        document.getElementById("santriForm").addEventListener("submit", function(e) {
            e.preventDefault();
            
            const id = document.getElementById("santriId").value;
            const nama = document.getElementById("santriNama").value;
            const no_ktm = document.getElementById("santriKtm").value.trim();
            const asal = document.getElementById("santriAsal").value;
            const angkatan = document.getElementById("santriAngkatan").value;
            const semester_aktif = Number(document.getElementById("santriSemester").value);
            
            const url = id ? 'api/update-santri.php' : 'api/add-santri.php';
            const body = id 
                ? { id: id, nama: nama, no_ktm: no_ktm, asal: asal, angkatan: angkatan, semester_aktif: semester_aktif }
                : { nama: nama, no_ktm: no_ktm, asal: asal, angkatan: angkatan, semester_aktif: semester_aktif };
            
            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert(id ? 'Santri berhasil diupdate!' : 'Santri berhasil ditambahkan!');
                    closeModal();
                    loadSantri();
                } else {
                    alert('Error: ' + data.error);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Terjadi kesalahan');
            });
        });
        
        // Delete santri
        function deleteSantri(id) {
            if (confirm('Yakin ingin menghapus santri ini?')) {
                fetch('api/delete-santri.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: id })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        alert('Santri berhasil dihapus!');
                        loadSantri();
                    } else {
                        alert('Error: ' + data.error);
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Terjadi kesalahan');
                });
            }
        }
        
        // Logout
        document.getElementById("btn-logout").addEventListener("click", function() {
            localStorage.removeItem("user_data");
            localStorage.removeItem("user_id");
            localStorage.removeItem("user_role");
            window.location.href = "index.html";
        });
    </script>
    <script src="js/role-guard.js?v=20261023-4"></script>
    <script src="js/auth.js?v=20261023-4"></script>
    <script src="js/theme.js?v=20261023-12"></script>
</body>
</html>
