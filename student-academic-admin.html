<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#114d35">
  <title>Dokumen Akademik Mahasantri - MySantriQu</title>
  <link rel="stylesheet" href="student-academic-admin.css">
</head>
<body data-access="admin">
  <header class="admin-header">
    <a href="dashboard.html">Kembali ke Dashboard</a>
    <h1>Dokumen Akademik Mahasantri</h1>
    <p>Tinjau pengumpulan skripsi dan unggah KHS PDF.</p>
  </header>

  <main class="admin-content">
    <label for="student-select">Pilih Mahasantri</label>
    <select id="student-select">
      <option value="">Memuat daftar Mahasantri...</option>
    </select>
    <p id="page-message" role="status" aria-live="polite"></p>

    <section class="admin-card">
      <h2>Unggah KHS PDF</h2>
      <form id="khs-upload-form">
        <label for="khs-semester">Semester</label>
        <select id="khs-semester" required>
          <option value="">Pilih semester</option>
          <option value="1">Semester 1</option>
          <option value="2">Semester 2</option>
          <option value="3">Semester 3</option>
          <option value="4">Semester 4</option>
          <option value="5">Semester 5</option>
          <option value="6">Semester 6</option>
        </select>
        <label for="khs-file">File KHS (PDF, maksimal 10 MB)</label>
        <input id="khs-file" type="file" accept="application/pdf,.pdf" required>
        <button type="submit">Unggah KHS</button>
      </form>
      <div id="khs-list" class="document-list"></div>
    </section>

    <section class="admin-card">
      <h2>Pengumpulan Skripsi</h2>
      <div id="thesis-list" class="document-list"></div>
    </section>
  </main>

  <script src="js/auth.js?v=20261023-4"></script>
  <script src="js/role-guard.js?v=20261023-4"></script>
  <script src="js/theme.js?v=20261023-13"></script>
  <script src="js/student-academic-admin.js?v=20261102-1"></script>
</body>
</html>
