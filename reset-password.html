<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#114d35" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="assets/app-icon-192.png" />
    <meta name="referrer" content="no-referrer" />
    <title>Atur Ulang Kata Sandi</title>
    <link rel="stylesheet" href="style.css?v=20261012-3" />
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
  </head>
  <body>
    <main class="login-box">
      <div class="brand-logo"><img src="assets/Logo.png" alt="Logo MySantriQu" /></div>
      <div class="brand-badge"><ion-icon name="leaf-outline"></ion-icon> Sistem Pendidikan</div>
      <form class="login-form" id="reset-form">
        <h2 class="brand-title">Ahlan para Musyrif Sejati</h2>
        <h2>Atur Ulang Kata Sandi</h2>
        <div class="input-box">
          <span class="icon"><ion-icon name="lock-closed-outline"></ion-icon></span>
          <input type="password" id="new-password" autocomplete="new-password" minlength="10" maxlength="72" required />
          <label for="new-password">Kata sandi baru</label>
        </div>
        <div class="input-box">
          <span class="icon"><ion-icon name="lock-closed-outline"></ion-icon></span>
          <input type="password" id="confirm-password" autocomplete="new-password" minlength="10" maxlength="72" required />
          <label for="confirm-password">Ulangi kata sandi baru</label>
        </div>
        <p id="reset-message" class="auth-message" role="status" aria-live="polite" hidden></p>
        <button type="submit">Simpan Kata Sandi</button>
        <a class="register-text" href="index.html">Kembali ke Login</a>
      </form>
    </main>
    <script>
      const resetForm = document.getElementById("reset-form");
      const resetMessage = document.getElementById("reset-message");
      const resetToken = new URLSearchParams(window.location.search).get("token") || "";
      window.history.replaceState({}, document.title, window.location.pathname);
      if (!/^[a-f0-9]{64}$/.test(resetToken)) {
        resetMessage.textContent = "Link reset tidak valid atau sudah kedaluwarsa.";
        resetMessage.dataset.state = "error";
        resetMessage.hidden = false;
        resetForm.querySelector("button[type=submit]").disabled = true;
      }
      resetForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!resetForm.reportValidity()) return;
        const password = document.getElementById("new-password").value;
        const confirmation = document.getElementById("confirm-password").value;
        if (password !== confirmation) {
          resetMessage.textContent = "Kata sandi dan konfirmasinya tidak sama.";
          resetMessage.dataset.state = "error";
          resetMessage.hidden = false;
          return;
        }
        try {
          const response = await fetch("api/reset-password.php", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              token: resetToken,
              password: password
            })
          });
          const data = await response.json();
          if (!response.ok || !data.success) throw new Error(data.error || "Reset kata sandi gagal.");
          resetMessage.textContent = data.message;
          resetMessage.dataset.state = "success";
          resetMessage.hidden = false;
          resetForm.querySelector("button[type=submit]").disabled = true;
        } catch (error) {
          resetMessage.textContent = error.message;
          resetMessage.dataset.state = "error";
          resetMessage.hidden = false;
        }
      });
    </script>
    <script src="js/theme.js?v=20261012-3"></script>
  </body>
</html>
